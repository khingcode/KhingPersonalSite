<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>khing's room</title>
<meta name="description" content="come on in. play the piano, look at the memories on the wall, read the verse on the note." />
<meta property="og:title" content="khing's room" />
<meta property="og:description" content="come on in. play the piano, look at the memories on the wall." />
<meta name="theme-color" content="#eadfff" />
<link rel="icon" href="../favicon.ico" sizes="any" />
<link rel="icon" type="image/png" sizes="32x32" href="../favicon-32.png" />
<link rel="apple-touch-icon" href="../apple-touch-icon.png" />
<script>try{if(localStorage.getItem("theme")==="dark")document.documentElement.classList.add("dark")}catch(e){}
try{if(sessionStorage.getItem("room-pass")==="1")sessionStorage.removeItem("room-pass");else document.documentElement.classList.add("locked")}catch(e){document.documentElement.classList.add("locked")}</script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
<noscript><link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" /></noscript>
<link rel="preload" as="image" href="../assets/coder.webp" />
<link rel="preload" as="image" href="../assets/board.webp" />
<style>
:root{--ink:#4b3f72;--line:#4b3f72;--wall:#eadfff;--wall2:#e2d4ff;--floor:#c9a5f2;--base:#cdb8ff;--paper:#fff;--shadow:rgba(75,63,114,.3);--rug:#ffd6e7;--rugline:#f4a6c4;--fy:520px;--sc:1}
html.dark{--ink:#efe8ff;--line:#9d8bee;--wall:#2a2150;--wall2:#251c48;--floor:#3a2d70;--base:#443680;--paper:#2a2150;--shadow:rgba(0,0,0,.4);--rug:#5b3a78;--rugline:#8a5fb0}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;background:var(--wall);transition:background .5s}
body{position:fixed;inset:0;font-family:'Quicksand',system-ui,sans-serif;color:var(--ink);transition:color .5s}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
.hud{position:fixed;left:.8rem;top:.8rem;z-index:50;display:flex;gap:.5rem;flex-wrap:wrap}
.pill{font-family:'Space Mono',monospace;font-weight:700;font-size:.78rem;background:#fff;color:#4b3f72;border:2.5px solid #4b3f72;border-radius:999px;padding:.3rem .8rem;box-shadow:2px 3px 0 var(--shadow);text-decoration:none;transition:transform .15s}
.pill:hover{transform:translateY(-2px)}
html.dark .pill{background:#2a2150;color:#efe8ff;border-color:#9d8bee}
.wallbg{position:fixed;left:0;right:0;top:0;height:var(--fy);background:repeating-linear-gradient(90deg,var(--wall) 0 56px,var(--wall2) 56px 112px);transition:background .5s}
.floorbg{position:fixed;left:0;right:0;top:var(--fy);bottom:0;background:var(--floor);border-top:calc(24px*var(--sc)) solid var(--base);box-shadow:inset 0 3px 0 var(--line);transition:background .5s}
.floorbg:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 calc(48px*var(--sc)),rgba(0,0,0,.09) calc(48px*var(--sc)) calc(50px*var(--sc)))}

/* the stage: one fixed-size room that is scaled to fit the screen, so nothing scrolls */
.stage{position:absolute;left:0;top:0;width:1280px;height:720px;--wb:500;transform-origin:0 0}
@media(max-aspect-ratio:1/1){.stage{width:480px;height:820px;--wb:470}}
.f{position:absolute;left:var(--x);top:var(--y);transform:scale(var(--s,1));transform-origin:0 0;z-index:var(--z,1)}
@media(max-aspect-ratio:1/1){.f{left:var(--px);top:var(--py);transform:scale(var(--ps,1))}.nop{display:none!important}}
.f svg,.f img{display:block}
html.dark .art{filter:brightness(.74) saturate(.95)}
.art{transition:filter .5s}
.sign{position:absolute;left:0;right:0;top:12px;text-align:center;z-index:5}
.sign h1{font-size:2.6rem;letter-spacing:-.02em;line-height:1.05;color:#6d3fe0;text-shadow:0 3px 0 rgba(139,92,246,.25)}
html.dark .sign h1{color:#fff;-webkit-text-stroke:1px #c4b5fd;text-shadow:0 0 6px #fff,0 0 18px #a78bfa,0 0 42px #8b5cf6,0 0 80px #8b5cf6}
.sign p{font-family:'Space Mono',monospace;font-size:.85rem;opacity:.8;margin-top:.25rem}
@media(max-aspect-ratio:1/1){.sign{top:60px}.sign h1{font-size:2.1rem}.sign p{display:none}}
.lab{position:absolute;left:50%;transform:translateX(-50%);top:-1.15rem;font-family:'Space Mono',monospace;font-weight:700;font-size:.78rem;letter-spacing:.04em;background:#8b5cf6;color:#fff;border:2.5px solid #4b3f72;border-radius:999px;padding:.22rem .8rem;box-shadow:2px 3px 0 var(--shadow);white-space:nowrap;z-index:9;pointer-events:none}
html.dark .lab{border-color:#c9b8ff}
.lab:before{content:"";display:inline-block;width:.5rem;height:.5rem;border-radius:50%;background:#ffd166;margin-right:.45rem;vertical-align:1px}
.click{cursor:pointer;transition:transform .15s}
.click:hover,.click:focus-visible{transform:scale(calc(var(--s,1)*1.04)) rotate(-1deg);outline:none}
.click:active{transform:scale(calc(var(--s,1)*.97))}
.tap{position:absolute;left:50%;bottom:-.7rem;transform:translateX(-50%);font-family:'Space Mono',monospace;font-weight:700;font-size:.72rem;background:#ffd166;color:#4b3f72;border:2.5px solid #4b3f72;border-radius:999px;padding:.12rem .65rem;white-space:nowrap;animation:bob 1.6s ease-in-out infinite;z-index:9;pointer-events:none}
@keyframes bob{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,-4px)}}
.rug{position:absolute;left:var(--x);top:var(--y);width:var(--w);height:var(--h);border-radius:50%;background:var(--rug);border:5px dashed var(--rugline);opacity:.9;transition:background .5s}
@media(max-aspect-ratio:1/1){.rug{left:var(--px);top:var(--py);width:var(--pw);height:var(--ph)}}
.rug:after{content:"";position:absolute;inset:14px;border-radius:50%;border:2px solid var(--rugline);opacity:.7}
.coder-unused{}
#coder{width:270px;height:267px;pointer-events:none;--lx:20;--ly:29.4;--lw:11;--lh:5.2;--sx:75;--sy:36;--sw:26;--sh:20}
#coder .spr,#coder .la,#coder .lb,#coder .ha,#coder .hb{position:absolute;inset:0}
#coder .la,#coder .lb{background:url(../assets/coder.webp) 0 0/400% 300% no-repeat}
#coder .ha,#coder .hb{background:0 0/200% 100% no-repeat}
#coder .lb,#coder .ha,#coder .hb{opacity:0}
#coder .hit{position:absolute;left:6%;top:6%;width:90%;height:90%;pointer-events:auto;cursor:pointer}
#coder .lglow,#coder .lpool,#coder .lbulb,#coder .mglow,#coder .mscreen,#coder .mdesk{position:absolute;pointer-events:none;opacity:0;transition:opacity .9s ease}
html.dark #coder .lglow,html.dark #coder .lpool,html.dark #coder .lbulb,html.dark #coder .mglow,html.dark #coder .mscreen,html.dark #coder .mdesk{opacity:1}
#coder .mglow{left:calc(var(--sx)*1% - var(--sw)*1.2%);top:calc(var(--sy)*1% - var(--sh)*1.3%);width:calc(var(--sw)*2.4%);height:calc(var(--sh)*2.6%);border-radius:50%;background:radial-gradient(ellipse,rgba(150,178,255,.5) 0%,rgba(130,150,255,.24) 42%,rgba(130,150,255,0) 72%);mix-blend-mode:screen}
#coder .mscreen{left:calc(var(--sx)*1% - var(--sw)*.55%);top:calc(var(--sy)*1% - var(--sh)*.55%);width:calc(var(--sw)*1.1%);height:calc(var(--sh)*1.1%);border-radius:30%;background:radial-gradient(ellipse,rgba(225,232,255,.34) 0%,rgba(215,225,255,.16) 65%,rgba(215,225,255,0) 100%);mix-blend-mode:screen}
#coder .mdesk{left:calc(var(--sx)*1% - var(--sw)*.85%);top:calc(var(--sy)*1% + var(--sh)*.45%);width:calc(var(--sw)*1.7%);height:calc(var(--sh)*.55%);border-radius:50%;background:radial-gradient(ellipse,rgba(150,178,255,.3),rgba(150,178,255,0) 70%);mix-blend-mode:screen}
#coder .lglow{left:calc(var(--lx)*1% - 36%);top:calc(var(--ly)*1% - 30%);width:58%;height:58%;border-radius:50%;background:radial-gradient(circle,rgba(255,214,120,.5) 0%,rgba(255,200,100,.22) 40%,rgba(255,200,100,0) 70%);mix-blend-mode:screen}
#coder .lpool{left:calc(var(--lx)*1% - 18%);top:calc(var(--ly)*1% + 10.6%);width:44%;height:16%;border-radius:50%;background:radial-gradient(ellipse,rgba(255,220,140,.42),rgba(255,220,140,0) 70%);mix-blend-mode:screen}
#coder .lbulb{left:calc(var(--lx)*1% - var(--lw)*.46%);top:calc(var(--ly)*1% - var(--lh)*.44%);width:calc(var(--lw)*.92%);height:calc(var(--lh)*.88%);border-radius:50%;transform:rotate(-14deg);background:radial-gradient(ellipse at 45% 50%,#fffbe3 0%,#ffe08a 42%,#f6a93b 100%);box-shadow:0 0 14px 4px rgba(255,214,120,.75)}.glow{position:absolute;left:210px;top:-40px;width:190px;height:190px;border-radius:50%;background:radial-gradient(rgba(255,226,122,.6),transparent 65%);opacity:0;transition:opacity .5s;pointer-events:none;z-index:-1}
html.dark .glow{opacity:1}
.steam{animation:steam 2.4s ease-in-out infinite}@keyframes steam{0%,100%{opacity:.25}50%{opacity:.7}}
.n{opacity:0;transition:opacity .5s}html.dark .n{opacity:1}
.d{opacity:1;transition:opacity .5s}html.dark .d{opacity:0}
.hint2{position:absolute;left:0;right:0;bottom:12px;text-align:center;font-family:'Space Mono',monospace;font-size:.78rem;opacity:.85}
@media(max-aspect-ratio:1/1){.hint2{bottom:10px;font-size:.7rem}}

/* (chibi styles below are no longer used) */
.seat{position:absolute;left:30px;top:20px;width:110px;z-index:2}
.seat .sprite{position:relative;width:110px;transition:transform .2s;transform-origin:50% 100%}
.seat .sprite.hop{animation:hop .5s ease-out}
@keyframes hop{0%{transform:none}40%{transform:translateY(-14px) rotate(-3deg)}100%{transform:none}}
.seat img{display:block;width:100%;height:auto}
.seat svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.seat .hidden{display:none}
.bub{position:absolute;left:50%;top:-34px;transform:translateX(-50%);z-index:12;background:var(--paper);color:var(--ink);border:3px solid var(--line);border-radius:16px;padding:.35rem .75rem;font-weight:700;font-size:.82rem;box-shadow:3px 3px 0 var(--shadow);white-space:nowrap;transition:opacity .3s;pointer-events:none}
.bub.off{opacity:0}

/* wall clock: leans and grows when hovered */
.clk{cursor:pointer;transition:transform .2s cubic-bezier(.3,1.6,.5,1);filter:drop-shadow(0 4px 0 rgba(75,63,114,.18))}
.clk:hover,.clk:focus-visible{outline:none;transform:scale(calc(var(--s,1)*1.2)) rotate(-10deg)}
.clk:active{transform:scale(calc(var(--s,1)*1.1)) rotate(-6deg)}
@media(max-aspect-ratio:1/1){.clk:hover,.clk:focus-visible{transform:scale(calc(var(--ps,1)*1.2)) rotate(-10deg)}.clk:active{transform:scale(calc(var(--ps,1)*1.1)) rotate(-6deg)}}
/* world clock pop-up */
.wc-row{display:flex;gap:1.4rem;justify-content:center;flex-wrap:wrap;padding:.4rem .2rem}
.wc{display:flex;flex-direction:column;align-items:center;gap:.4rem;min-width:9.5rem}
.wc svg{width:9rem;height:9rem}
.wc .nm{font-family:'Space Mono',monospace;font-weight:700;font-size:.85rem;background:#8b5cf6;color:#fff;border:2.5px solid #4b3f72;border-radius:999px;padding:.15rem .8rem}
.wc .dg{font-family:'Space Mono',monospace;font-weight:700;font-size:1.5rem}
.wc .sm{font-family:'Space Mono',monospace;font-size:.72rem;opacity:.7;margin-top:-.2rem}
.wc svg{stroke:#3a2a4d}html.dark .wc svg .face{fill:#e9e0ff}
/* bulletin board pop-up */
.bm{position:fixed;inset:0;z-index:100;display:none;place-items:center;background:rgba(20,14,46,.6);padding:1rem}
.bm.show{display:grid}
.bm-card{width:100%;max-width:820px;max-height:94vh;max-height:94dvh;display:flex;flex-direction:column;background:var(--paper);border:2px solid var(--line);border-radius:14px;box-shadow:0 6px 0 var(--shadow);overflow:hidden;animation:pop .22s ease-out}
.bm-body{overflow:auto;padding:1rem}
.cork{position:relative;padding:1.4rem 1.1rem 1.2rem;background:#d9a06b;border:6px solid #8a5a3b;border-radius:10px;background-image:radial-gradient(rgba(0,0,0,.1) 1.2px,transparent 1.6px);background-size:9px 9px;display:grid;gap:1.4rem 1.2rem;grid-template-columns:1fr;align-items:center}
@media(min-width:680px){.cork{grid-template-columns:minmax(0,.9fr) minmax(0,2.1fr)}}
.polas{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem .6rem}
@media(max-width:679px){.cork{padding:1.1rem .7rem .9rem;gap:1.1rem}.pola{padding:.3rem .3rem .2rem}.pola .cap{font-size:.55rem}.note{padding:1.1rem .9rem .8rem}.note .q{font-size:.95rem}.bm-body{padding:.7rem}}
.pola{position:relative;background:#fff;color:#4b3f72;padding:.4rem .4rem .3rem;box-shadow:2px 4px 0 rgba(0,0,0,.22);transform:rotate(var(--r,0deg));transition:transform .2s;text-align:center;width:100%}
.pola:hover,.pola:focus-visible{transform:rotate(0deg) scale(1.06);z-index:4;outline:none}
.pola .ph{aspect-ratio:1/1;border-radius:2px;overflow:hidden;display:grid;place-items:center;background:var(--g,linear-gradient(135deg,#e9ddff,#cfe3ff))}
.pola .ph img{width:100%;height:100%;object-fit:cover;object-position:50% 30%;display:block}
.pola .ph svg{width:38%;opacity:.55}
.pola .cap{display:block;font-family:'Space Mono',monospace;font-size:.66rem;margin-top:.3rem;line-height:1.3}
.pola:before{content:"";position:absolute;left:50%;top:-8px;width:13px;height:13px;margin-left:-6px;border-radius:50%;background:#8b5cf6;box-shadow:0 2px 0 rgba(0,0,0,.3);z-index:2}
.pola.tape:before{width:54px;height:16px;margin-left:-27px;top:-9px;border-radius:2px;background:rgba(210,190,255,.9);box-shadow:none;transform:rotate(-3deg)}
.note{position:relative;width:min(100%,250px);margin:0 auto;padding:1.4rem 1.1rem 1.1rem;background:#fff3b8;border:3px solid #e6cf5f;transform:rotate(-2.5deg);box-shadow:3px 5px 0 rgba(0,0,0,.18);color:#4b3f72;text-align:left}
.note:before{content:"";position:absolute;left:50%;top:-9px;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:#8b5cf6;box-shadow:0 2px 0 rgba(0,0,0,.3)}
.note .q{font-size:1.05rem;font-weight:700;line-height:1.5}
.note .ref{display:block;margin-top:.8rem;font-family:'Space Mono',monospace;font-size:.8rem;font-weight:700;color:#8b5cf6}
.note .tiny{display:block;font-family:'Space Mono',monospace;font-size:.62rem;opacity:.55;margin-top:.15rem}
/* piano */
.piano{width:100%;max-width:720px;margin:0 auto}
.pbody{position:relative;background:#2b2140;border:4px solid #4b3f72;border-radius:16px 16px 6px 6px;padding:.9rem .9rem 0;box-shadow:0 8px 0 var(--shadow)}
html.dark .pbody{border-color:#9d8bee}
.pbody .fall{height:.5rem;border-radius:3px;background:#3b2f5a;margin-bottom:.5rem}
.keys{position:relative;display:flex;height:170px;user-select:none;-webkit-user-select:none;touch-action:none}
.wk{flex:1;position:relative;background:linear-gradient(#fff,#f1eaff);border:2px solid #4b3f72;border-top:0;border-radius:0 0 8px 8px;margin:0 1px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:.4rem;font-family:'Space Mono',monospace;font-size:.62rem;color:#8b7fbd;cursor:pointer;touch-action:none;transition:background .08s,transform .08s;-webkit-tap-highlight-color:transparent}
.wk.on{background:linear-gradient(#e4d6ff,#c9b3ff);transform:translateY(2px)}
.bk{position:absolute;top:0;height:62%;z-index:2;background:#2b2140;border:2px solid #120d22;border-top:0;border-radius:0 0 6px 6px;cursor:pointer;touch-action:none;transition:background .08s;color:#c9b8ff;font-family:'Space Mono',monospace;font-size:.55rem;display:flex;align-items:flex-end;justify-content:center;padding-bottom:.3rem;-webkit-tap-highlight-color:transparent}
.bk.on{background:#7c4ae0}
.hint{font-family:'Space Mono',monospace;font-size:.75rem;text-align:center;opacity:.85;margin-top:.9rem}
.ptools{display:flex;justify-content:center;gap:.6rem;margin-top:.7rem;flex-wrap:wrap}
.btn{font-family:'Space Mono',monospace;font-weight:700;font-size:.8rem;background:#8b5cf6;color:#fff;border:2.5px solid #4b3f72;border-radius:12px;padding:.35rem .9rem;box-shadow:3px 3px 0 var(--shadow);transition:transform .15s}
html.dark .btn{border-color:#c9b8ff}
.btn:hover{transform:translateY(-2px)}
.btn.ghost{background:var(--paper);color:var(--ink)}
@media(hover:none){.k-hint{display:none}}
@media(max-width:639px){.k-hint{display:none}}
.wk i,.bk i{font-style:normal}
.fx{position:absolute;pointer-events:none;font-size:1.3rem;color:#a78bfa;animation:rise 1.1s ease-out forwards;z-index:6}
@keyframes rise{from{opacity:1;transform:translateY(0) rotate(0)}to{opacity:0;transform:translateY(-70px) rotate(14deg)}}
/* lightbox */
.lb{position:fixed;inset:0;z-index:100;display:none;place-items:center;background:rgba(20,14,46,.7);padding:1rem}
.lb.show{display:grid}
.lb .card{background:#fff;color:#4b3f72;padding:.8rem .8rem 1rem;max-width:min(92vw,520px);box-shadow:4px 6px 0 rgba(0,0,0,.3);text-align:center;transform:rotate(-1.5deg);animation:pop .2s ease-out}
.lb .ph{width:min(80vw,440px);min-height:120px;display:grid;place-items:center;background:var(--g,linear-gradient(135deg,#e9ddff,#cfe3ff))}
.lb .ph img{display:block;width:100%;height:auto;max-height:72vh;max-height:72dvh;object-fit:contain}
.lb .ph svg{width:30%;opacity:.5}
.lb .cap{font-family:'Space Mono',monospace;font-size:.85rem;margin-top:.7rem}
.lb .cap small{display:block;opacity:.6;margin-top:.2rem}
@keyframes pop{from{opacity:0;transform:scale(.92)}to{opacity:1}}
/* piano pop-up */
.pm{position:fixed;inset:0;z-index:100;display:none;place-items:center;background:rgba(20,14,46,.6);padding:1rem}
.pm.show{display:grid}
.pm-card{width:100%;max-width:760px;background:var(--paper);border:2px solid var(--line);border-radius:14px;box-shadow:0 6px 0 var(--shadow);overflow:hidden;animation:pop .22s ease-out}
.pm-bar{display:flex;align-items:center;justify-content:space-between;background:#4b3f72;color:#fff;padding:.65rem 1rem;font-family:'Space Mono',monospace;font-size:.95rem}
html.dark .pm-bar{background:#5b4c96}
.pm-bar button{color:#fff;padding:0 .3rem;border-radius:6px}.pm-bar button:hover{background:rgba(255,255,255,.2)}
.pm-body{padding:1.1rem 1rem 1.2rem}
.fx{z-index:200!important}
/* password gate */
.gate{position:fixed;inset:0;z-index:300;display:none;place-items:center;background:var(--wall);padding:1rem}
html.locked .gate{display:grid}
html.locked .stage,html.locked .hud,html.locked .wallbg,html.locked .floorbg,html.locked #pm,html.locked #lb,html.locked #bm,html.locked #wcm{display:none!important}
.gate-card{width:min(92vw,24rem);background:var(--paper);border:2px solid var(--line);border-radius:14px;box-shadow:0 6px 0 var(--shadow);overflow:hidden;text-align:center}
.gate-card .pm-bar{justify-content:flex-start}
.gate-card form{padding:1.6rem 1.4rem 1.5rem}
.gate-card h2{font-size:1.5rem;margin-bottom:.3rem}
.gate-card p{font-size:.9rem;opacity:.75;margin-bottom:1rem}
.gate-in{width:100%;border:2px solid var(--line);border-radius:.75rem;background:var(--paper);color:var(--ink);padding:.55rem .8rem;font-size:16px;text-align:center;outline:none;font-family:'Space Mono',monospace}
.gate-in:focus{border-color:#8b5cf6;box-shadow:0 0 0 3px rgba(139,92,246,.25)}
.gate-err{min-height:1.3rem;margin:.6rem 0 .3rem!important;color:#d6336c;font-weight:700;opacity:1!important}
.gate-card form.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wallbg"></div><div class="floorbg"></div>

<nav class="hud" aria-label="room controls">
  <a class="pill" href="../" id="back">← desktop</a>
  <button class="pill" id="soundbtn" aria-pressed="true" title="sound on / off">♪ sound on</button>
</nav>

<main class="stage" id="stage">
  <header class="sign"><h1>welcome to my room</h1><p>make yourself at home :)</p></header>

  <div class="rug" style="--x:300px;--y:560px;--w:680px;--h:110px;--px:50px;--py:700px;--pw:380px;--ph:80px"></div>

  <!-- window: click to switch day / night -->
  <button class="f click art" id="win" style="--x:60px;--y:160px;--px:14px;--py:150px;--ps:.78;--z:2" aria-label="switch between day and night">

<script>

  { src: '../assets/room/memory-1.webp', cap: 'family',        date: '' },
  { src: '../assets/room/memory-2.webp', cap: 'Love them sm',  date: '' },
  { src: '../assets/room/memory-3.webp', cap: 'Ohana 💜',      date: '' },

/* ============== page ============== */
const $ = (s, r = document) => r.querySelector(s);

// the whole room scales to fit the screen, so there is never anything to scroll
const stage = $('#stage');
function fit() {

}
addEventListener('resize', fit); addEventListener('orientationchange', fit);

// day / night (shared with the main site)
function paintTheme() {

}

// wall clock shows the real time
// the guy at the laptop: 12 frames blended one into the next, looping without a pause. the lamp and the monitor glow come on with night mode (css).
// hover him (or tap him on a phone) and he turns round and gives a thumbs-up, and stays that way while the cursor stays on him.
(() => {
  const box = $('#coder'); if (!box) return;
  const la = box.querySelector('.la'), lb = box.querySelector('.lb'), ha = box.querySelector('.ha'), hb = box.querySelector('.hb'), hit = box.querySelector('.hit');
  const LAMP = [[31.17, 32.14, 11.49, 5.64], [30.91, 32.22, 11.64, 5.47], [30.74, 32.05, 11.66, 5.81], [30.74, 32.14, 11.66, 5.64], [31.01, 31.88, 11.81, 5.81], [30.91, 31.95, 11.66, 5.68], [30.76, 31.88, 11.62, 5.81], [30.74, 31.88, 11.66, 5.81], [31.08, 31.88, 11.66, 5.81], [30.86, 31.88, 11.54, 5.81], [30.66, 31.88, 11.49, 5.81], [30.66, 31.97, 11.49, 5.64], [27.28, 27.64, 9.8, 5.06], [30.81, 31.91, 11.63, 5.81]];
  const SCREEN = [[76.1, 43.16, 22.64, 17.09], [76.1, 43.2, 22.7, 17.1], [76.36, 42.99, 23.49, 16.75], [76.18, 43.33, 22.47, 17.09], [76.1, 43.16, 22.64, 17.09], [76.18, 43.16, 22.8, 17.09], [76.1, 43.25, 23.31, 17.26], [76.01, 43.25, 22.47, 17.26], [76.1, 43.08, 22.64, 17.26], [76.1, 43.2, 22.7, 17.1], [76.18, 43.25, 23.14, 17.26], [76.01, 43.25, 22.8, 17.26], [81.5, 37.01, 22.3, 17.78], [77.62, 37.18, 32.09, 17.78]];
  const N = 12, HF1 = 12, HF2 = 13, STEP = 520, HSTEP = 120, LOOP = N * STEP;
  const pos = (n) => ((n % 4) * 100 / 3) + '% ' + (Math.floor(n / 4) * 50) + '%';
  la.style.backgroundPosition = pos(0);
  // the two hover frames are a separate, tiny image, fetched a moment after the page is up
  const loadHover = () => { const u = '../assets/coder-hover.webp'; const im = new Image(); im.onload = () => { ha.style.backgroundImage = hb.style.backgroundImage = 'url(' + u + ')'; }; im.src = u; };
  ha.style.backgroundPosition = '0% 0%'; hb.style.backgroundPosition = '100% 0%';
  loadHover();

})();

function tickClock() {

}

// world clocks: philippines and phnom penh
const ZONES = [
  { id: 'ph', name: 'philippines', tz: 'Asia/Manila', off: 'utc+8' },

];
const CLK = (id) => '<svg viewBox="0 0 80 80" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><circle cx="40" cy="40" r="35" fill="#8a6a46"/><circle class="face" cx="40" cy="40" r="28" fill="#fff8ee"/><g stroke-width="2.5"><path d="M40 16v4M40 60v4M16 40h4M60 40h4"/></g><line id="' + id + 'h" x1="40" y1="40" x2="40" y2="26" stroke-width="4"/><line id="' + id + 'm" x1="40" y1="40" x2="40" y2="19" stroke-width="3"/><line id="' + id + 's" x1="40" y1="44" x2="40" y2="17" stroke="#ff9b8a" stroke-width="1.6"/><circle cx="40" cy="40" r="3" fill="#ff9b8a"/></svg>';

wcRow.innerHTML = ZONES.map((z) => '<div class="wc">' + CLK(z.id) + '<span class="nm">' + z.name + '</span><span class="dg" id="' + z.id + 'd"></span><span class="sm" id="' + z.id + 'x"></span></div>').join('');

const wcm = $('#wcm');

$('#verse-q').textContent = '“' + VERSE.text + '”';

// bulletin board pop-up
const GRADS = [
  'linear-gradient(135deg,#e9ddff,#cfe3ff)', 'linear-gradient(135deg,#ffe0ee,#ffe9c9)', 'linear-gradient(135deg,#d6f5e6,#dbe8ff)',
  'linear-gradient(135deg,#fff1c9,#ffd9e6)', 'linear-gradient(135deg,#dcd3ff,#ffd9f0)', 'linear-gradient(135deg,#cfeeff,#e6ddff)'
];
const ROT = [-3, 2.5, -1.5, 3, -2.5, 1.5];
const CAM = '<svg viewBox="0 0 64 64" fill="none" stroke="#4b3f72" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"><path d="M8 20h12l4-6h16l4 6h12v32H8z"/><circle cx="32" cy="36" r="9"/></svg>';

const polas = $('#polas');
MEMORIES.forEach((m, i) => {

  b.addEventListener('click', () => {

const bm = $('#bm'), lb = $('#lb');
$('#board').addEventListener('click', () => bm.classList.add('show'));
$('#bm-x').addEventListener('click', () => bm.classList.remove('show'));
bm.addEventListener('pointerdown', (e) => { if (e.target === bm) bm.classList.remove('show'); });

/* ---------- piano ---------- */
const keysEl = $('#keys');
const WHITE = ['C','D','E','F','G','A','B'];
const BLACK_AFTER = { C: 'C#', D: 'D#', F: 'F#', G: 'G#', A: 'A#' };
const SEMI = { C: 0, 'C#': 1, D: 2, 'D#': 3, E: 4, F: 5, 'F#': 6, G: 7, 'G#': 8, A: 9, 'A#': 10, B: 11 };

// computer keyboard: home row = white keys from C4, row above = black keys
const WKEYS = 'asdfghjkl;\'';
const BKEYS = { 'w': 'C#4', 'e': 'D#4', 't': 'F#4', 'y': 'G#4', 'u': 'A#4', 'o': 'C#5', 'p': 'D#5' };
const els = {};
let kmap = {};

function build() {
  keysEl.innerHTML = '';
  const count = innerWidth < 640 ? 10 : 15; // white keys
  const names = [];
  for (let i = 0; i < count; i++) names.push([WHITE[i % 7], 4 + Math.floor(i / 7)]);
  kmap = {};
  names.forEach(([n, o], i) => {
    const w = document.createElement('div');
    w.className = 'wk'; w.dataset.note = n + o;
    w.innerHTML = '<i class="k-hint">' + (WKEYS[i] ? WKEYS[i].toUpperCase() : '') + '</i>';
    if (WKEYS[i]) kmap[WKEYS[i]] = n + o;
    keysEl.appendChild(w); els[n + o] = w;
    if (BLACK_AFTER[n] && i < count - 1) {
      const b = document.createElement('div');
      b.className = 'bk'; b.dataset.note = BLACK_AFTER[n] + o;
      b.style.width = (60 / count) + '%'; b.style.left = ((i + 1) / count * 100 - 30 / count) + '%';
      keysEl.appendChild(b); els[BLACK_AFTER[n] + o] = b;
    }
  });
  Object.entries(BKEYS).forEach(([k, v]) => { if (els[v]) { kmap[k] = v; const l = document.createElement('i'); l.className = 'k-hint'; l.textContent = k.toUpperCase(); els[v].appendChild(l); } });
}
build();
let lastCount = innerWidth < 640;
addEventListener('resize', () => { const m = innerWidth < 640; if (m !== lastCount) { lastCount = m; build(); } });
if (matchMedia('(hover:none)').matches || innerWidth < 640) $('#hinttxt').textContent = 'tap the keys · slide to glide';

// the grand piano opens the keyboard
const pm = $('#pm');
function openPiano() { pm.classList.add('show'); audio(); say('play me something! ♪', 2600); }
function closePiano() { if (!pm.classList.contains('show')) return; pm.classList.remove('show'); stopTune(); [...held].forEach(up); }
$('#grand').addEventListener('click', openPiano);
$('#pm-x').addEventListener('click', closePiano);
pm.addEventListener('pointerdown', (e) => { if (e.target === pm) closePiano(); });

// sound: a small synthesized piano (no audio files needed)
let ac, master;
function audio() {
  if (!ac) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    ac = new AC();
    master = ac.createDynamicsCompressor();
    const g = ac.createGain(); g.gain.value = .7;
    master.connect(g); g.connect(ac.destination);
  }
  if (ac.state === 'suspended') ac.resume();

}
function tone(note, dur) {
  const a = audio(); if (!a) return;
  const m = /^([A-G]#?)(\d)$/.exec(note); if (!m) return;
  const f = freq(m[1], +m[2]), t = a.currentTime, len = dur || 1.9;
  const env = a.createGain();
  env.gain.setValueAtTime(0.0001, t);
  env.gain.exponentialRampToValueAtTime(.55, t + .008);
  env.gain.exponentialRampToValueAtTime(.18, t + .25);
  env.gain.exponentialRampToValueAtTime(.0001, t + len);

  lp.frequency.setValueAtTime(5200, t); lp.frequency.exponentialRampToValueAtTime(1400, t + len);
  [[1, 'triangle', 1], [2, 'sine', .35], [3, 'sine', .14], [4, 'sine', .06]].forEach(([mult, type, amp]) => {
    const o = a.createOscillator(); o.type = type; o.frequency.value = f * mult;
    const g = a.createGain(); g.gain.value = amp / 1.5;
    o.connect(g); g.connect(env); o.start(t); o.stop(t + len + .05);
  });

}

// (the room has no one to react to the piano now)
function say() {}
function react() {}

// press / release
function fx(el) {
  const r = el.getBoundingClientRect(), s = document.createElement('span');

  s.style.left = (r.left + scrollX + r.width / 2 - 6) + 'px'; s.style.top = (r.top + scrollY - 6) + 'px';
  document.body.appendChild(s); setTimeout(() => s.remove(), 1100);
}
function press(note, quiet) {
  const el = els[note]; if (!el) return;
  tone(note); el.classList.add('on'); fx(el); if (!quiet) react();

}
const held = new Set();
function down(note) { const el = els[note]; if (!el || held.has(note)) return; held.add(note); tone(note); el.classList.add('on'); fx(el); react(); }

// pointer: tap, chord, and slide a finger across the keys
const ptr = new Map();
function noteAt(x, y) { const e = document.elementFromPoint(x, y); const k = e && e.closest('[data-note]'); return k && keysEl.contains(k) ? k.dataset.note : null; }
keysEl.addEventListener('pointerdown', (e) => {

// a little tune (amazing grace, public domain). [note, beats]
const TUNE = [['G4',1],['C5',2],['E5',.5],['C5',.5],['E5',2],['D5',1],['C5',2],['A4',1],['G4',2],['G4',1],['C5',2],['E5',.5],['C5',.5],['E5',2],['D5',1],['G4',3],['C5',3]];

function cyrb53(str, seed = 0) { let h1 = 0xdeadbeef ^ seed, h2 = 0x41c6ce57 ^ seed; for (let i = 0, ch; i < str.length; i++) { ch = str.charCodeAt(i); h1 = Math.imul(h1 ^ ch, 2654435761); h2 = Math.imul(h2 ^ ch, 1597334677); } h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909); h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909); return 4294967296 * (2097151 & h2) + (h1 >>> 0); }
const KEY = '6513342087438648';
const gateForm = $('#gate-form'), gateIn = $('#gate-in');
if (root.classList.contains('locked')) setTimeout(() => gateIn.focus(), 50);
gateForm.addEventListener('submit', (e) => {
  e.preventDefault();
  if (String(cyrb53(gateIn.value.trim().toLowerCase())) === KEY) {
    root.classList.remove('locked'); fit();
  } else {
    $('#gate-err').textContent = "hmm, that's not it"; gateIn.value = '';
    gateForm.classList.remove('shake'); void gateForm.offsetWidth; gateForm.classList.add('shake'); gateIn.focus();
  }
});

/* ---------- room sound: a soft typing loop (pauses while you hover the avatar) ---------- */
(() => {
  const btn = $('#soundbtn');
  let on = true, hovering = false, a = null;
  try { on = localStorage.getItem('room-sound') !== 'off'; } catch (e) {}
  const paint = () => { btn.textContent = on ? '♪ sound on' : '♪ sound off'; btn.setAttribute('aria-pressed', on); };
  paint();
  const locked = () => root.classList.contains('locked');
  const VOL = 0.22;
  // click sounds: the same little synthesized blips as the main page
  function blip(f0, f1, dur, type, vol, delay = 0) {
    const c = audio(); if (!c) return;
    const t = c.currentTime + delay, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.008); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(c.destination); o.start(t); o.stop(t + dur + 0.03);
  }
  const SFX = {
    pop:   () => { const r = 0.94 + Math.random() * 0.12; blip(520 * r, 880 * r, 0.09, 'sine', 0.14); },
    open:  () => { blip(440, 660, 0.09, 'triangle', 0.12); blip(660, 990, 0.12, 'triangle', 0.1, 0.07); },
    close: () => blip(620, 300, 0.12, 'triangle', 0.13),
    day:   () => [988, 1318, 1568].forEach((f, i) => blip(f, f * 1.02, 0.14, 'sine', 0.07, i * 0.06)),
    night: () => [659, 523, 392].forEach((f, i) => blip(f, f * 0.98, 0.16, 'sine', 0.08, i * 0.07))
  };
  const sfx = (n) => { if (!on || locked()) return; try { SFX[n](); } catch (e) {} };
  $('#win').addEventListener('click', () => sfx(root.classList.contains('dark') ? 'night' : 'day'));
  $('#board').addEventListener('click', () => sfx('open'));
  $('#bm-x').addEventListener('click', () => sfx('close'));
  $('#clock').addEventListener('click', () => sfx('open'));
  $('#wcm-x').addEventListener('click', () => sfx('close'));
  $('#wcm').addEventListener('click', (e) => { if (e.target === $('#wcm')) sfx('close'); });
  $('#bm').addEventListener('click', (e) => { if (e.target.closest('.pola')) sfx('pop'); else if (e.target === $('#bm')) sfx('close'); });
  $('#lb').addEventListener('click', () => sfx('close'));
  function el() {
    if (!a) { a = new Audio('../assets/typing.mp3'); a.loop = true; a.preload = 'auto'; a.volume = VOL; }
    return a;
  }
  function sync() {
    const want = on && !hovering && !locked() && !document.hidden;
    if (!a && !want) return;
    const x = el();
    x.volume = pm.classList.contains('show') ? VOL * 0.4 : VOL;
    if (want && x.paused) { const p = x.play(); if (p && p.catch) p.catch(() => {}); }
    else if (!want && !x.paused) x.pause();
  }
  // browsers only allow sound after a tap or key, so it begins on the first one
  ['pointerdown', 'keydown', 'touchstart'].forEach((ev) => addEventListener(ev, sync, { passive: true }));
  btn.addEventListener('click', () => {
    on = !on; try { localStorage.setItem('room-sound', on ? 'on' : 'off'); } catch (e) {}
    paint(); sync();
  });
  window.addEventListener('coder-hover', (e) => { hovering = !!e.detail; sync(); });
  new MutationObserver(sync).observe(root, { attributes: true, attributeFilter: ['class'] });
  new MutationObserver(sync).observe(pm, { attributes: true, attributeFilter: ['class'] });
  document.addEventListener('visibilitychange', sync);
})();
</script>
</body>
</html>
