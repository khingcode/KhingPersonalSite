<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>khing's room</title>
<meta name="description" content="come on in. play the piano, look at the memories on the wall, read the verse on the note." />
<meta property="og:title" content="khing's room" />
<meta property="og:description" content="come on in. play the piano, look at the memories on the wall." />
<meta name="theme-color" content="#eadfff" />
<link rel="icon" href="../favicon.ico" sizes="any" />
<link rel="icon" type="image/png" sizes="32x32" href="../favicon-32.png" />
<link rel="apple-touch-icon" href="../apple-touch-icon.png" />
<script>try{if(localStorage.getItem("theme")==="dark")document.documentElement.classList.add("dark")}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
<style>
:root{--ink:#4b3f72;--line:#4b3f72;--wall:#eadfff;--wall2:#e2d4ff;--floor:#b99df2;--floor2:#ad8eec;--base:#cdb8ff;--sky1:#bfe3ff;--sky2:#e9f6ff;--paper:#fff;--shadow:rgba(75,63,114,.3);--wood:#d9b48c;--cork:#d9b48c;--corkline:#8a6a46;--rug:#ffd6e7;--rugline:#f4a6c4;--bean:#8b5cf6}
html.dark{--ink:#efe8ff;--line:#9d8bee;--wall:#2a2150;--wall2:#251c48;--floor:#3a2d70;--floor2:#33266a;--base:#443680;--sky1:#0f0b2a;--sky2:#2a1f5e;--paper:#2a2150;--shadow:rgba(0,0,0,.4);--wood:#7a6296;--cork:#9a7a5c;--corkline:#6e5a8f;--rug:#5b3a78;--rugline:#8a5fb0;--bean:#6d46d8}
*{box-sizing:border-box;margin:0}
html{background:var(--wall);transition:background .5s}
body{position:relative;font-family:'Quicksand',system-ui,sans-serif;color:var(--ink);min-height:100vh;min-height:100dvh;overflow-x:hidden;transition:color .5s}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.mono{font-family:'Space Mono',ui-monospace,monospace}

/* top pills */
.hud{position:fixed;left:.8rem;top:.8rem;z-index:50;display:flex;gap:.5rem;flex-wrap:wrap}
.pill{font-family:'Space Mono',monospace;font-weight:700;font-size:.78rem;background:#fff;color:#4b3f72;border:2.5px solid #4b3f72;border-radius:999px;padding:.3rem .8rem;box-shadow:2px 3px 0 var(--shadow);text-decoration:none;transition:transform .15s}
.pill:hover{transform:translateY(-2px)}
html.dark .pill{background:#2a2150;color:#efe8ff;border-color:#9d8bee}

/* the room */
.room{position:relative;max-width:1180px;margin:0 auto;padding:0 1rem}
.wallbg{position:absolute;left:0;right:0;top:0;height:var(--wallh,520px);z-index:-2;background:repeating-linear-gradient(90deg,var(--wall) 0 56px,var(--wall2) 56px 112px);transition:background .5s}
.floorbg{position:absolute;left:0;right:0;top:var(--wallh,520px);bottom:0;z-index:-2;background:var(--floor);border-top:26px solid var(--base);box-shadow:inset 0 3px 0 var(--line);transition:background .5s}
.floorbg:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 52px,rgba(0,0,0,.08) 52px 54px)}
.sign{text-align:center;padding:4.2rem 0 1.4rem}
.sign h1{font-size:clamp(2.2rem,7vw,3.6rem);letter-spacing:-.02em;line-height:1.05;color:#6d3fe0;text-shadow:0 3px 0 rgba(139,92,246,.25)}
html.dark .sign h1{color:#fff;-webkit-text-stroke:1px #c4b5fd;text-shadow:0 0 6px #fff,0 0 18px #a78bfa,0 0 42px #8b5cf6,0 0 80px #8b5cf6}
.sign p{font-family:'Space Mono',monospace;font-size:.9rem;opacity:.8;margin-top:.4rem}

.wall{display:grid;grid-template-columns:1fr;gap:2.4rem;align-items:start;justify-items:center;padding-bottom:2rem}
@media(min-width:900px){.wall{grid-template-columns:minmax(0,.8fr) minmax(0,1.7fr) minmax(0,.9fr);gap:1.5rem;justify-items:stretch}}

.lab{display:inline-block;font-family:'Space Mono',monospace;font-weight:700;font-size:.78rem;letter-spacing:.04em;background:#8b5cf6;color:#fff;border:2.5px solid #4b3f72;border-radius:999px;padding:.25rem .8rem;box-shadow:2px 3px 0 var(--shadow);white-space:nowrap}
html.dark .lab{border-color:#c9b8ff}
.lab:before{content:"";display:inline-block;width:.5rem;height:.5rem;border-radius:50%;background:#ffd166;margin-right:.45rem;vertical-align:1px}
.item{position:relative;display:flex;flex-direction:column;align-items:center;gap:.6rem;width:100%}
.item>.lab{position:relative;z-index:3;margin-bottom:-1.1rem}

/* window */
.win{position:relative;width:min(100%,250px);margin:0 auto;padding-bottom:1.2rem;cursor:pointer;-webkit-tap-highlight-color:transparent}
.pane{position:relative;height:290px;border:4px solid var(--line);border-radius:18px 18px 4px 4px;overflow:hidden;background:linear-gradient(var(--sky1),var(--sky2));transition:background .5s,border-color .5s;z-index:1}
.sun{position:absolute;right:34px;top:36px;width:56px;height:56px;border-radius:50%;background:#ffe27a;box-shadow:0 0 0 10px rgba(255,226,122,.35);transition:all .5s}
html.dark .sun{background:#fff3c4;box-shadow:0 0 30px 6px rgba(255,243,196,.55)}
.sun:after{content:"";position:absolute;left:14px;top:-6px;width:56px;height:56px;border-radius:50%;background:var(--sky2);opacity:0;transition:opacity .5s}
html.dark .sun:after{opacity:1}
.cl{position:absolute;background:#fff;border-radius:99px;height:24px;opacity:.95;transition:opacity .5s}
html.dark .cl{opacity:.12}
.st{position:absolute;color:#fff;font-size:14px;opacity:0;transition:opacity .5s}html.dark .st{opacity:.9}
.m1,.m2{position:absolute;background:var(--line)}
.m1{left:50%;top:0;bottom:0;width:8px;margin-left:-4px}.m2{top:50%;left:0;right:0;height:8px;margin-top:-4px}
.curt{position:absolute;top:-6px;width:46px;height:310px;border:3px solid var(--line);background:linear-gradient(90deg,#c4a8ff,#b18cf7);border-radius:0 0 28px 28px;z-index:2;transition:background .5s}
html.dark .curt{background:linear-gradient(90deg,#4c3a96,#3d2d80)}
.curt.l{left:-22px}.curt.r{right:-22px;transform:scaleX(-1)}
.sill{position:absolute;left:-14px;right:-14px;bottom:.9rem;height:18px;background:#fff;border:4px solid var(--line);border-radius:6px;z-index:2;transition:background .5s}
html.dark .sill{background:#443680}

/* bulletin board */
.cork{position:relative;width:100%;max-width:640px;margin:0 auto;padding:1.6rem 1rem 1.2rem;background:var(--cork);border:6px solid var(--corkline);border-radius:8px;box-shadow:0 6px 0 var(--shadow);background-image:radial-gradient(rgba(0,0,0,.08) 1.2px,transparent 1.5px);background-size:9px 9px;transition:background-color .5s}
.polas{display:grid;grid-template-columns:repeat(2,1fr);gap:1.1rem .8rem;padding:.4rem .2rem}
@media(min-width:560px){.polas{grid-template-columns:repeat(3,1fr)}}
.pola{position:relative;background:#fff;color:#4b3f72;padding:.45rem .45rem .35rem;box-shadow:2px 4px 0 rgba(0,0,0,.2);transform:rotate(var(--r,0deg));transition:transform .2s;text-align:center;width:100%}
.pola:hover,.pola:focus-visible{transform:rotate(0deg) scale(1.06);z-index:4;outline:none}
.pola .ph{aspect-ratio:1/1;border-radius:2px;overflow:hidden;display:grid;place-items:center;background:var(--g,linear-gradient(135deg,#e9ddff,#cfe3ff))}
.pola .ph img{width:100%;height:100%;object-fit:cover;display:block}
.pola .ph svg{width:38%;opacity:.55}
.pola .cap{display:block;font-family:'Space Mono',monospace;font-size:.68rem;margin-top:.35rem;line-height:1.3}
.pola:before{content:"";position:absolute;left:50%;top:-8px;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:#ef4444;box-shadow:0 2px 0 rgba(0,0,0,.3);z-index:2}
.pola.tape:before{width:54px;height:16px;margin-left:-27px;top:-9px;border-radius:2px;background:rgba(255,236,150,.85);box-shadow:none;transform:rotate(-3deg)}

/* verse note */
.note{position:relative;width:min(100%,260px);margin:0 auto;padding:1.4rem 1.1rem 1.1rem;background:#fff3b8;border:3px solid #e6cf5f;transform:rotate(2.5deg);box-shadow:3px 5px 0 rgba(0,0,0,.14);color:#4b3f72;text-align:left}
.note:before{content:"";position:absolute;left:50%;top:-9px;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:#ef4444;box-shadow:0 2px 0 rgba(0,0,0,.3)}
.note .q{font-size:1.08rem;font-weight:700;line-height:1.5}
.note .ref{display:block;margin-top:.8rem;font-family:'Space Mono',monospace;font-size:.8rem;font-weight:700;color:#8b5cf6}
.note .tiny{display:block;font-family:'Space Mono',monospace;font-size:.62rem;opacity:.55;margin-top:.15rem}

/* floor */
.floor{position:relative;display:grid;grid-template-columns:1fr;gap:2rem;padding:3.2rem 0 5rem;justify-items:center}
@media(min-width:900px){.floor{grid-template-columns:minmax(0,.8fr) minmax(0,1.7fr) minmax(0,.9fr);align-items:end;gap:1.5rem;padding-top:2.4rem}}
.rug{position:absolute;left:12%;right:12%;bottom:.3rem;height:70px;border-radius:50%;background:var(--rug);border:5px dashed var(--rugline);opacity:.85;z-index:-1;transition:background .5s}

/* piano */
.piano{width:100%;max-width:720px;margin:0 auto}
.pbody{position:relative;background:#2b2140;border:4px solid #4b3f72;border-radius:16px 16px 6px 6px;padding:.9rem .9rem 0;box-shadow:0 8px 0 var(--shadow)}
html.dark .pbody{border-color:#9d8bee}
.pbody .fall{height:.5rem;border-radius:3px;background:#3b2f5a;margin-bottom:.5rem}
.keys{position:relative;display:flex;height:170px;user-select:none;-webkit-user-select:none;touch-action:none}
.wk{flex:1;position:relative;background:linear-gradient(#fff,#f1eaff);border:2px solid #4b3f72;border-top:0;border-radius:0 0 8px 8px;margin:0 1px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:.4rem;font-family:'Space Mono',monospace;font-size:.62rem;color:#8b7fbd;cursor:pointer;touch-action:none;transition:background .08s,transform .08s;-webkit-tap-highlight-color:transparent}
.wk.on{background:linear-gradient(#e4d6ff,#c9b3ff);transform:translateY(2px)}
.bk{position:absolute;top:0;height:62%;z-index:2;background:#2b2140;border:2px solid #120d22;border-top:0;border-radius:0 0 6px 6px;cursor:pointer;touch-action:none;transition:background .08s;color:#c9b8ff;font-family:'Space Mono',monospace;font-size:.55rem;display:flex;align-items:flex-end;justify-content:center;padding-bottom:.3rem;-webkit-tap-highlight-color:transparent}
.bk.on{background:#7c4ae0}
.hint{font-family:'Space Mono',monospace;font-size:.75rem;text-align:center;opacity:.85;margin-top:.9rem}
.ptools{display:flex;justify-content:center;gap:.6rem;margin-top:.7rem;flex-wrap:wrap}
.btn{font-family:'Space Mono',monospace;font-weight:700;font-size:.8rem;background:#8b5cf6;color:#fff;border:2.5px solid #4b3f72;border-radius:12px;padding:.35rem .9rem;box-shadow:3px 3px 0 var(--shadow);transition:transform .15s}
html.dark .btn{border-color:#c9b8ff}
.btn:hover{transform:translateY(-2px)}
.btn.ghost{background:var(--paper);color:var(--ink)}
@media(hover:none){.k-hint{display:none}}
.wk i,.bk i{font-style:normal}
.fx{position:absolute;pointer-events:none;font-size:1.3rem;color:#a78bfa;animation:rise 1.1s ease-out forwards;z-index:6}
@keyframes rise{from{opacity:1;transform:translateY(0) rotate(0)}to{opacity:0;transform:translateY(-70px) rotate(14deg)}}

/* chibi + beanbag */
.chibi{position:relative;display:flex;flex-direction:column;align-items:center;width:200px;margin:0 auto}
.chibi .sprite{position:relative;width:150px;margin-bottom:-52px;z-index:3;transition:transform .2s;transform-origin:50% 100%}
.chibi .sprite.hop{animation:hop .5s ease-out}
@keyframes hop{0%{transform:none}40%{transform:translateY(-16px) rotate(-3deg)}100%{transform:none}}
.chibi .sprite img{display:block;width:100%;height:auto}
.chibi svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.chibi .hidden{display:none}
.bean{position:relative;z-index:2;width:190px;height:96px;background:var(--bean);border:4px solid var(--line);border-radius:60% 60% 40% 40%/80% 80% 30% 30%;transition:background .5s}
.bub{position:absolute;left:50%;top:-1.8rem;transform:translateX(-50%);z-index:5;background:var(--paper);color:var(--ink);border:3px solid var(--line);border-radius:16px;padding:.4rem .8rem;font-weight:700;font-size:.85rem;box-shadow:3px 3px 0 var(--shadow);white-space:nowrap;transition:opacity .3s}
.bub.off{opacity:0}

/* desk */
.desk{position:relative;width:min(100%,270px);height:170px;margin:0 auto}
.desk .top{position:absolute;left:0;right:0;bottom:62px;height:20px;background:var(--wood);border:4px solid var(--line);border-radius:6px;transition:background .5s}
.desk .leg{position:absolute;bottom:0;width:20px;height:62px;background:var(--wood);border:4px solid var(--line);border-top:0}
.desk .leg.l{left:12px}.desk .leg.r{right:12px}
.lap{position:absolute;left:18px;bottom:82px;width:110px;height:70px;background:#2a2150;border:4px solid var(--line);border-radius:8px 8px 0 0;padding:7px 8px;font-family:'Space Mono',monospace;font-size:8px;line-height:1.5;color:#a8f0c0;overflow:hidden}
.lap i{color:#ffd166;font-style:normal}
.mug{position:absolute;right:30px;bottom:82px;width:30px;height:28px;background:#fff;border:4px solid var(--line);border-radius:4px 4px 10px 10px}
.mug:after{content:"";position:absolute;right:-13px;top:4px;width:11px;height:12px;border:4px solid var(--line);border-left:0;border-radius:0 10px 10px 0}
.lamp{position:absolute;left:150px;bottom:82px;width:56px;height:70px}
.lamp .pole{position:absolute;left:24px;bottom:0;width:7px;height:48px;background:var(--line)}
.lamp .head{position:absolute;left:2px;top:4px;width:52px;height:28px;background:#ffd166;border:4px solid var(--line);border-radius:26px 26px 4px 4px;transform:rotate(-8deg)}
.glow{position:absolute;left:100px;bottom:50px;width:150px;height:150px;border-radius:50%;background:radial-gradient(rgba(255,226,122,.55),transparent 65%);opacity:0;transition:opacity .5s;pointer-events:none}
html.dark .glow{opacity:1}

.plant{position:relative;width:90px;height:150px;margin:0 auto}
.plant .pot{position:absolute;bottom:0;left:15px;width:60px;height:56px;background:#ff9b8a;border:4px solid var(--line);border-radius:6px 6px 14px 14px}
.plant .lf{position:absolute;width:32px;height:78px;background:#6fd0a3;border:3px solid var(--line);border-radius:60% 60% 60% 60%/80% 80% 20% 20%;bottom:48px;transform-origin:50% 100%}
.foot{position:relative;text-align:center;font-family:'Space Mono',monospace;font-size:.8rem;padding:0 0 2rem;opacity:.85}
.foot a{color:inherit;font-weight:700}

/* lightbox */
.lb{position:fixed;inset:0;z-index:100;display:none;place-items:center;background:rgba(20,14,46,.7);padding:1rem}
.lb.show{display:grid}
.lb .card{background:#fff;color:#4b3f72;padding:.8rem .8rem 1rem;max-width:min(92vw,520px);box-shadow:4px 6px 0 rgba(0,0,0,.3);text-align:center;transform:rotate(-1.5deg);animation:pop .2s ease-out}
.lb .ph{width:min(80vw,440px);aspect-ratio:1/1;display:grid;place-items:center;background:var(--g,linear-gradient(135deg,#e9ddff,#cfe3ff))}
.lb .ph img{width:100%;height:100%;object-fit:cover}
.lb .ph svg{width:30%;opacity:.5}
.lb .cap{font-family:'Space Mono',monospace;font-size:.85rem;margin-top:.7rem}
.lb .cap small{display:block;opacity:.6;margin-top:.2rem}
@keyframes pop{from{opacity:0;transform:scale(.92)}to{opacity:1}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wallbg" id="wallbg"></div><div class="floorbg" id="floorbg"></div>

<nav class="hud" aria-label="room controls">
  <a class="pill" href="../" id="back">← desktop</a>
  <button class="pill" id="themebtn" aria-pressed="false" title="day / night">☀ day</button>
</nav>

<main class="room">
  <header class="sign">
    <h1>welcome to my room</h1>
    <p>make yourself at home :)</p>
  </header>

  <section class="wall" id="wall">
    <!-- window: click to switch day / night -->
    <div class="item">
      <span class="lab">day / night</span>
      <button class="win" id="win" aria-label="switch between day and night">
        <div class="pane">
          <div class="sun"></div>
          <div class="cl" style="left:24px;top:90px;width:80px"></div><div class="cl" style="left:90px;top:122px;width:60px"></div><div class="cl" style="left:140px;top:70px;width:70px"></div>
          <span class="st" style="left:40px;top:50px">✦</span><span class="st" style="left:120px;top:110px">✦</span><span class="st" style="left:170px;top:170px">✦</span><span class="st" style="left:60px;top:200px">✦</span>
          <div class="m1"></div><div class="m2"></div>
        </div>
        <div class="curt l"></div><div class="curt r"></div><div class="sill"></div>
      </button>
    </div>

    <!-- bulletin board -->
    <div class="item">
      <span class="lab">memories</span>
      <div class="cork">
        <div class="polas" id="polas"></div>
      </div>
    </div>

    <!-- pinned verse -->
    <div class="item">
      <span class="lab">verse</span>
      <div class="note">
        <p class="q" id="verse-q"></p>
        <span class="ref" id="verse-ref"></span>
        <span class="tiny" id="verse-tr"></span>
      </div>
    </div>
  </section>

  <section class="floor" id="floor">
    <div class="rug" aria-hidden="true"></div>

    <div class="desk" aria-hidden="true">
      <div class="glow"></div>
      <div class="lap"><i>const</i> room = {<br>&nbsp;cozy: <i>true</i>,<br>&nbsp;visitors: <i>"welcome"</i><br>}</div>
      <div class="lamp"><div class="head"></div><div class="pole"></div></div>
      <div class="mug"></div>
      <div class="top"></div><div class="leg l"></div><div class="leg r"></div>
    </div>

    <div class="piano">
      <div class="item" style="margin-bottom:.4rem"><span class="lab">piano ♪</span></div>
      <div class="pbody" id="pbody">
        <div class="fall"></div>
        <div class="keys" id="keys" role="group" aria-label="piano keys"></div>
      </div>
      <p class="hint"><span class="k-hint">tap the keys or use your keyboard · </span><span class="k-hint2">tap the keys</span></p>
      <div class="ptools">
        <button class="btn" id="tune">▶ play a tune</button>
        <button class="btn ghost" id="stop" hidden>■ stop</button>
      </div>
    </div>

    <div style="display:flex;gap:1rem;align-items:flex-end;justify-content:center">
      <div class="chibi">
        <p class="bub off" id="bub" role="status"></p>
        <div class="sprite" id="chibi">
          <img src="../assets/mascot.webp" width="500" height="500" alt="" draggable="false" />
          <svg viewBox="0 0 1000 1000" fill="#000" stroke="#000" aria-hidden="true">
            <g data-eye="open"><g><ellipse cx="369" cy="486" rx="20.5" ry="48.5" stroke="none"/><ellipse cx="530" cy="486" rx="20.5" ry="48.5" stroke="none"/></g></g>
            <g data-eye="happy" class="hidden" fill="none" stroke-width="15" stroke-linecap="round"><path d="M347 508 Q369 456 391 508"/><path d="M508 508 Q530 456 552 508"/></g>
            <g data-eye="sleepy" class="hidden" fill="none" stroke-width="14" stroke-linecap="round"><path d="M347 490 Q369 520 391 490"/><path d="M508 490 Q530 520 552 490"/></g>
          </svg>
        </div>
        <div class="bean"></div>
      </div>
      <div class="plant" aria-hidden="true"><div class="lf" style="left:6px;transform:rotate(-24deg)"></div><div class="lf" style="left:28px;height:92px"></div><div class="lf" style="left:48px;transform:rotate(26deg)"></div><div class="pot"></div></div>
    </div>
  </section>

  <p class="foot">← <a href="../">back to the desktop</a></p>
</main>

<div class="lb" id="lb" role="dialog" aria-label="memory" aria-modal="true">
  <div class="card"><div class="ph" id="lb-ph"></div><p class="cap" id="lb-cap"></p></div>
</div>

<script>
/* ============== things you can edit ============== */

// the pinned verse (public domain KJV). change the three lines and it changes on the note.
const VERSE = {
  text: 'God is our refuge and strength, a very present help in trouble.',
  ref: 'psalm 46:1',
  tr: 'kjv'
};

// the photos on the bulletin board. add a photo by putting the file in assets/room/ and
// setting src, e.g. src: '../assets/room/first.webp'. leave src empty to show a placeholder.
const MEMORIES = [
  { src: '', cap: 'memory one',   date: 'photo coming soon' },
  { src: '', cap: 'memory two',   date: 'photo coming soon' },
  { src: '', cap: 'memory three', date: 'photo coming soon' },
  { src: '', cap: 'memory four',  date: 'photo coming soon' },
  { src: '', cap: 'memory five',  date: 'photo coming soon' },
  { src: '', cap: 'memory six',   date: 'photo coming soon' }
];

/* ============== page ============== */
const $ = (s, r = document) => r.querySelector(s);
const root = document.documentElement;

// day / night (shared with the main site)
const themeBtn = $('#themebtn');
function paintTheme() {
  const dark = root.classList.contains('dark');
  themeBtn.textContent = dark ? '☾ night' : '☀ day';
  themeBtn.setAttribute('aria-pressed', dark);
  $('meta[name="theme-color"]').content = dark ? '#150f2e' : '#eadfff';
}
function flipTheme() {
  root.classList.toggle('dark');
  try { localStorage.setItem('theme', root.classList.contains('dark') ? 'dark' : 'light'); } catch (e) {}
  paintTheme();
}
themeBtn.addEventListener('click', flipTheme);
$('#win').addEventListener('click', flipTheme);
paintTheme();

// the verse
$('#verse-q').textContent = '“' + VERSE.text + '”';
$('#verse-ref').textContent = '— ' + VERSE.ref;
$('#verse-tr').textContent = VERSE.tr;

// the wall / floor backgrounds follow the real height of the wall
function sizeBg() {
  const wallBottom = $('#wall').getBoundingClientRect().bottom + scrollY;
  document.documentElement.style.setProperty('--wallh', Math.round(wallBottom) + 'px');
}
addEventListener('load', sizeBg); addEventListener('resize', sizeBg);
new ResizeObserver(sizeBg).observe(document.body);

// bulletin board
const GRADS = [
  'linear-gradient(135deg,#e9ddff,#cfe3ff)', 'linear-gradient(135deg,#ffe0ee,#ffe9c9)', 'linear-gradient(135deg,#d6f5e6,#dbe8ff)',
  'linear-gradient(135deg,#fff1c9,#ffd9e6)', 'linear-gradient(135deg,#dcd3ff,#ffd9f0)', 'linear-gradient(135deg,#cfeeff,#e6ddff)'
];
const ROT = [-3, 2.5, -1.5, 3, -2.5, 1.5];
const CAM = '<svg viewBox="0 0 64 64" fill="none" stroke="#4b3f72" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"><path d="M8 20h12l4-6h16l4 6h12v32H8z"/><circle cx="32" cy="36" r="9"/></svg>';
function phHTML(m) { return m.src ? '<img src="' + m.src + '" alt="' + m.cap + '" loading="lazy" decoding="async">' : CAM; }
const polas = $('#polas');
MEMORIES.forEach((m, i) => {
  const b = document.createElement('button');
  b.className = 'pola' + (i % 2 ? ' tape' : '');
  b.style.setProperty('--r', ROT[i % ROT.length] + 'deg');
  b.setAttribute('aria-label', 'open ' + m.cap);
  b.innerHTML = '<span class="ph" style="--g:' + GRADS[i % GRADS.length] + '">' + phHTML(m) + '</span><span class="cap">' + m.cap + '</span>';
  b.addEventListener('click', () => {
    $('#lb-ph').style.setProperty('--g', GRADS[i % GRADS.length]);
    $('#lb-ph').innerHTML = phHTML(m);
    $('#lb-cap').innerHTML = m.cap + '<small>' + m.date + '</small>';
    $('#lb').classList.add('show');
  });
  polas.appendChild(b);
});
const lb = $('#lb');
lb.addEventListener('click', () => lb.classList.remove('show'));
addEventListener('keydown', (e) => { if (e.key === 'Escape') lb.classList.remove('show'); });

/* ---------- piano ---------- */
const keysEl = $('#keys');
const WHITE = ['C','D','E','F','G','A','B'];
const BLACK_AFTER = { C: 'C#', D: 'D#', F: 'F#', G: 'G#', A: 'A#' };
const SEMI = { C: 0, 'C#': 1, D: 2, 'D#': 3, E: 4, F: 5, 'F#': 6, G: 7, 'G#': 8, A: 9, 'A#': 10, B: 11 };
const freq = (n, o) => 440 * Math.pow(2, (SEMI[n] + (o - 4) * 12 - 9) / 12);
// computer keyboard: home row = white keys from C4, row above = black keys
const WKEYS = 'asdfghjkl;\'';
const BKEYS = { 'w': 'C#4', 'e': 'D#4', 't': 'F#4', 'y': 'G#4', 'u': 'A#4', 'o': 'C#5', 'p': 'D#5' };
const els = {};
let kmap = {};

function build() {
  keysEl.innerHTML = '';
  const count = innerWidth < 640 ? 10 : 15; // white keys
  const names = [];
  for (let i = 0; i < count; i++) names.push([WHITE[i % 7], 4 + Math.floor(i / 7)]);
  kmap = {};
  names.forEach(([n, o], i) => {
    const w = document.createElement('div');
    w.className = 'wk'; w.dataset.note = n + o;
    w.innerHTML = '<i class="k-hint">' + (WKEYS[i] ? WKEYS[i].toUpperCase() : '') + '</i>';
    if (WKEYS[i]) kmap[WKEYS[i]] = n + o;
    keysEl.appendChild(w); els[n + o] = w;
    if (BLACK_AFTER[n] && i < count - 1) {
      const b = document.createElement('div');
      b.className = 'bk'; b.dataset.note = BLACK_AFTER[n] + o;
      b.style.width = (60 / count) + '%'; b.style.left = ((i + 1) / count * 100 - 30 / count) + '%';
      keysEl.appendChild(b); els[BLACK_AFTER[n] + o] = b;
    }
  });
  Object.entries(BKEYS).forEach(([k, v]) => { if (els[v]) { kmap[k] = v; const l = document.createElement('i'); l.className = 'k-hint'; l.textContent = k.toUpperCase(); els[v].appendChild(l); } });
}
build();
let lastCount = innerWidth < 640;
addEventListener('resize', () => { const m = innerWidth < 640; if (m !== lastCount) { lastCount = m; build(); } });
$('.k-hint2').style.display = 'none';

// sound: a small synthesized piano (no audio files needed)
let ac, master;
function audio() {
  if (!ac) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    ac = new AC();
    master = ac.createDynamicsCompressor();
    const g = ac.createGain(); g.gain.value = .7;
    master.connect(g); g.connect(ac.destination);
  }
  if (ac.state === 'suspended') ac.resume();
  return ac;
}
function tone(note, dur) {
  const a = audio(); if (!a) return;
  const m = /^([A-G]#?)(\d)$/.exec(note); if (!m) return;
  const f = freq(m[1], +m[2]), t = a.currentTime, len = dur || 1.9;
  const env = a.createGain();
  env.gain.setValueAtTime(0.0001, t);
  env.gain.exponentialRampToValueAtTime(.55, t + .008);
  env.gain.exponentialRampToValueAtTime(.18, t + .25);
  env.gain.exponentialRampToValueAtTime(.0001, t + len);
  const lp = a.createBiquadFilter(); lp.type = 'lowpass';
  lp.frequency.setValueAtTime(5200, t); lp.frequency.exponentialRampToValueAtTime(1400, t + len);
  [[1, 'triangle', 1], [2, 'sine', .35], [3, 'sine', .14], [4, 'sine', .06]].forEach(([mult, type, amp]) => {
    const o = a.createOscillator(); o.type = type; o.frequency.value = f * mult;
    const g = a.createGain(); g.gain.value = amp / 1.5;
    o.connect(g); g.connect(env); o.start(t); o.stop(t + len + .05);
  });
  env.connect(lp); lp.connect(master);
}

// chibi reacts
const chibi = $('#chibi'), bub = $('#bub');
let calm, talk;
function eye(name) { chibi.querySelectorAll('[data-eye]').forEach((g) => g.classList.toggle('hidden', g.dataset.eye !== name)); }
function say(t, ms) { bub.textContent = t; bub.classList.remove('off'); clearTimeout(talk); talk = setTimeout(() => bub.classList.add('off'), ms || 2600); }
const CHEERS = ['ooh~ ♪', 'keep going!', 'so pretty ♫', 'i love this one', 'play more!', '♪ ♫ ♪'];
let nPlayed = 0;
function react() {
  nPlayed++;
  eye('happy'); chibi.classList.remove('hop'); void chibi.offsetWidth; chibi.classList.add('hop');
  if (nPlayed === 1 || nPlayed % 14 === 0) say(CHEERS[(nPlayed / 14 | 0) % CHEERS.length]);
  clearTimeout(calm); calm = setTimeout(() => eye('open'), 1500);
}
setTimeout(() => say('play me something! ♪', 3200), 900);

// press / release
function fx(el) {
  const r = el.getBoundingClientRect(), s = document.createElement('span');
  s.className = 'fx'; s.textContent = Math.random() < .5 ? '♪' : '♫';
  s.style.left = (r.left + scrollX + r.width / 2 - 6) + 'px'; s.style.top = (r.top + scrollY - 6) + 'px';
  document.body.appendChild(s); setTimeout(() => s.remove(), 1100);
}
function press(note, quiet) {
  const el = els[note]; if (!el) return;
  tone(note); el.classList.add('on'); fx(el); if (!quiet) react();
  setTimeout(() => el.classList.remove('on'), 160);
}
const held = new Set();
function down(note) { const el = els[note]; if (!el || held.has(note)) return; held.add(note); tone(note); el.classList.add('on'); fx(el); react(); }
function up(note) { held.delete(note); const el = els[note]; if (el) el.classList.remove('on'); }

// pointer: tap, chord, and slide a finger across the keys
const ptr = new Map();
function noteAt(x, y) { const e = document.elementFromPoint(x, y); const k = e && e.closest('[data-note]'); return k && keysEl.contains(k) ? k.dataset.note : null; }
keysEl.addEventListener('pointerdown', (e) => {
  const n = noteAt(e.clientX, e.clientY); if (!n) return;
  e.preventDefault(); ptr.set(e.pointerId, n); down(n);
});
keysEl.addEventListener('pointermove', (e) => {
  if (!ptr.has(e.pointerId)) return;
  const n = noteAt(e.clientX, e.clientY), cur = ptr.get(e.pointerId);
  if (n && n !== cur) { up(cur); ptr.set(e.pointerId, n); down(n); }
});
const lift = (e) => { if (ptr.has(e.pointerId)) { up(ptr.get(e.pointerId)); ptr.delete(e.pointerId); } };
keysEl.addEventListener('pointerup', lift); keysEl.addEventListener('pointercancel', lift); keysEl.addEventListener('pointerleave', lift);
keysEl.addEventListener('contextmenu', (e) => e.preventDefault());

// computer keyboard
addEventListener('keydown', (e) => {
  if (e.ctrlKey || e.metaKey || e.altKey || e.repeat) return;
  const n = kmap[e.key.toLowerCase()]; if (n) { e.preventDefault(); down(n); }
});
addEventListener('keyup', (e) => { const n = kmap[e.key.toLowerCase()]; if (n) up(n); });

// a little tune (amazing grace, public domain). [note, beats]
const TUNE = [['G4',1],['C5',2],['E5',.5],['C5',.5],['E5',2],['D5',1],['C5',2],['A4',1],['G4',2],['G4',1],['C5',2],['E5',.5],['C5',.5],['E5',2],['D5',1],['G4',3],['C5',3]];
let playing = 0;
const tuneBtn = $('#tune'), stopBtn = $('#stop');
function stopTune() { playing++; tuneBtn.hidden = false; stopBtn.hidden = true; }
tuneBtn.addEventListener('click', async () => {
  audio(); const id = ++playing; tuneBtn.hidden = true; stopBtn.hidden = false;
  say('♪ amazing grace', 3000);
  for (const [n, b] of TUNE) {
    if (id !== playing) return;
    if (els[n]) { tone(n, b * .55 + .9); els[n].classList.add('on'); fx(els[n]); react(); setTimeout(() => els[n] && els[n].classList.remove('on'), 220); }
    await new Promise((r) => setTimeout(r, b * 520));
  }
  if (id === playing) stopTune();
});
stopBtn.addEventListener('click', stopTune);

// tapping the chibi
chibi.addEventListener('click', () => { eye('happy'); chibi.classList.remove('hop'); void chibi.offsetWidth; chibi.classList.add('hop'); say(['hi hi!', 'welcome to my room!', 'try the piano ♪', 'look at the wall →'][Math.random() * 4 | 0]); clearTimeout(calm); calm = setTimeout(() => eye('open'), 1500); });
try { localStorage.setItem('room-seen', '1'); } catch (e) {}
</script>
